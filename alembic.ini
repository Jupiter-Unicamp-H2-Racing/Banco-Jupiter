# Configuração do Alembic (migrations do banco).
# %(here)s = pasta onde este arquivo está (raiz do projeto; "/" no container).
[alembic]
script_location = %(here)s/migrations
# A URL real vem da variável DATABASE_URL (veja migrations/env.py).
sqlalchemy.url = postgresql+psycopg2://bootcamp:bootcamp@localhost:5432/bootcamp

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
